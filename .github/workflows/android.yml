name: android-apk

on:
  push:
    branches: [xiangqi-native-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Fetch NNUE weights (official release, fallback Networks repo)
        run: |
          set -e
          mkdir -p app/src/main/assets
          ok=0
          curl -sL --retry 3 --retry-delay 3 -o /tmp/pf.7z \
            "https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-09-06/Pikafish.2026-09-06.7z" && ok=1
          if [ "$ok" = "1" ]; then
            (sudo apt-get update -qq; sudo apt-get install -y -qq p7zip-full) || true
            mkdir -p /tmp/pf
            if 7z x -y -o/tmp/pf /tmp/pf.7z > /dev/null; then
              cp /tmp/pf/pikafish.nnue app/src/main/assets/pikafish.nnue && ok=2
            fi
          fi
          if [ "$ok" != "2" ]; then
            echo "== 回退：从 Networks 仓库取 NNUE =="
            curl -sL --retry 5 --retry-delay 3 -o app/src/main/assets/pikafish.nnue \
              "https://raw.githubusercontent.com/official-pikafish/Networks/master/pikafish.nnue"
            if head -c 40 app/src/main/assets/pikafish.nnue | grep -q git-lfs; then
              curl -sL --retry 5 --retry-delay 3 -o app/src/main/assets/pikafish.nnue \
                "https://media.githubusercontent.com/media/official-pikafish/Networks/master/pikafish.nnue"
            fi
          fi
          ls -la app/src/main/assets/

      - name: Verify bundled engine binary
        run: |
          ls -la app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/libpikafish.so || true

      - name: Build (unit tests + debug APK)
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xiangqi-v1.0.${{ github.run_number }}
          name: 象棋自动对弈助手 v1.0.${{ github.run_number }}
          body: |
            完全独立的原生 APK：内置 Pikafish 引擎与 NNUE 权重，无需 AutoX、无需 Termux。
            - arm64-v8a（Android 8.0+）
            - 安装后：开启无障碍服务 + 悬浮窗权限，首次使用校准棋盘、提取模板
            - 详细流程见仓库 app 目录下的使用说明
          files: app/build/outputs/apk/debug/app-debug.apk
